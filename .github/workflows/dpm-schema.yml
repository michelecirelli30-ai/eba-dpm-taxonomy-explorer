name: Inspect EBA DPM Access schema
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_dpm_access.py'
      - '.github/workflows/dpm-schema.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Access schema reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mdbtools
      - name: Inspect original EBA DPM schema
        run: python scripts/inspect_dpm_access.py
      - name: Save inspection metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/dpm_431_access_schema.json
          if ! git diff --cached --quiet; then
            git commit -m "data: inspect official DPM Access schema"
            git push
          fi
