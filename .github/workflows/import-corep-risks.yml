name: Import official COREP C11-C25 risk templates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install EBA Access extraction dependency
        run: sudo apt-get update && sudo apt-get install -y mdbtools
      - name: Extract official EBA DPM cells and verify source SHA-256
        run: python scripts/extract_corep_risks.py
      - name: Commit imported official files only when extraction succeeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/corep_risks docs/data/corep_risks_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Import EBA DPM 4.3 COREP C11-C25 official positions"
            git push
          fi
