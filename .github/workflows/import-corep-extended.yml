name: Import official COREP C32-C36 templates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbtools
        run: sudo apt-get update && sudo apt-get install -y mdbtools
      - name: Extract DPM 4.3 cells and validate source
        run: python scripts/extract_corep_extended.py
      - name: Commit verified COREP C32-C36 extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/corep_extended docs/data/corep_extended_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Import official EBA COREP C32-C36 DPM positions"
            git push
          fi
