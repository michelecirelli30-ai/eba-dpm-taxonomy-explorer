name: Inspect official EBA DPM packages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_eba_packages.py'
      - '.github/workflows/inspect-eba.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and inspect two official packages
        run: python scripts/inspect_eba_packages.py
      - name: Commit bounded archive manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/official_package_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: inspect official EBA DPM 4.3 archives"
            git push
          fi
