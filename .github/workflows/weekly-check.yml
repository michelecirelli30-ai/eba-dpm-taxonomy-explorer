name: Weekly EBA taxonomy source check
on:
  schedule:
    - cron: '13 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official EBA reporting source availability
        run: python scripts/weekly_check.py
      - name: Commit source health status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/source_health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly EBA taxonomy source status"
            git push
          fi
